{% load static %}
<!DOCTYPE html>
<html lang="en" style="height: 100%; display: flex; flex-direction: column;">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AskPupkin</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
</head>


<body style="height: 100%; display: flex; flex-direction: column;">
    <nav class="navbar navbar-expand-lg flex: 0 1 auto" style="background-color: #d3d3d3; flex: 0 1 auto">
        <div class="container-fluid">
            <div class="d-flex w-100 justify-content-between align-items-center">
                <a class="navbar-brand" href="{% url 'index' %}">AskPupkin</a>

                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit"><a class="text-reset text-decoration-none"
                        href="{% url 'ask' %}">ASK!</a></button>
                </form>

                <div class="d-flex align-items-center gap-3">
                    <img class="img-thumbnail rounded-circle" src="{% static 'img/avatarka.jpg' %}" alt="Avatar"
                        style="width: 40px; height: 40px;" />
                    <div>
                        <div>Dr. Pepper</div>
                        <a href="{% url 'settings' %}" class="me-2 text-decoration-none text-primary">Settings</a>
                        <a href="{% url 'login' %}" class="text-decoration-none text-primary">Log out</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mt-3" style="flex: 1 1 auto">

        <div class="row">

            {% block content %}

            {% endblock %}
            <div class="col-3">
                <section>
                    <h2 class="border-bottom pb-2">Popular Tags</h2>
                    {% for tag in popular_tags %}
                    <button type="button" class="btn btn-primary mt-2 ">
                        <a class="text-reset text-decoration-none" href="{% url 'tag' tag.name %}">{{ tag.name }}</a>
                    </button>
                    {% endfor %}
                </section>
                <section>
                    <h2 class="mt-5 border-bottom pb-2">Best Members</h2>
                    <ul class="list-group list-group-flush">
                        {% for member in members %}
                            <li class="list-group-item">
                                <a class="text-decoration-none" href="#">{{ member.user.username }}</a>
                            </li>
                        {% endfor %}
                    </ul>
                </section>
            </div>
        </div>
    </main>
    <footer class="bg-light text-center text-lg-start mt-3" style="flex: 0 1 auto">
        <div class="text-center p-3" style="background-color: #d3d3d3;">
            © 2024 AskPupkin.
        </div>
    </footer>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>

</html>
